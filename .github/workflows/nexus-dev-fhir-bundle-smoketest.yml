name: Nexus Dev FHIR Bundle SmokeTest

on:
  schedule:
    - cron: '15 3,15 * * *' # Runs at 3:15 AM and 3:15 PM UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'tech-by-design/polyglot-prime' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Download and setup JMeter
        run: |
          curl -fL -o apache-jmeter-5.6.3.tgz \
            https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 ./test-automation/

      - name: Decode the .p12 file
        env:
          P12_FILE_BASE64: ${{ secrets.TECHBD_NEXUS_DEV_KEY_BASE64 }}
        run: |
          set -euo pipefail
          CERT_DIR="./test-automation/Certificates/nexus"
          mkdir -p "$CERT_DIR"
          echo "$P12_FILE_BASE64" | base64 -d \
            > "$CERT_DIR/techbd-Nexus-dev-key.p12"

      - name: Update SSL paths in JMeter configuration files
        run: |
          set -euo pipefail
          CONFIG_DIR="./test-automation/apache-jmeter-5.6.3/bin"
          CERT_PATH="$GITHUB_WORKSPACE/test-automation/Certificates/nexus/techbd-Nexus-dev-key.p12"

          for file in jmeter.properties system.properties user.properties; do
            {
              echo "javax.net.ssl.keyStore=$CERT_PATH"
              echo "javax.net.ssl.keyStorePassword="
              echo "javax.net.ssl.keyStoreType=pkcs12"
            } >> "$CONFIG_DIR/$file"
          done

      - name: Run Nexus Dev FHIR Bundle SmokeTest
        id: run-tests
        shell: bash
        run: |
          environments=("Nexus-dev")
          environment_paths=(
            "./test-automation/Nexus-FHIR-Bundle-SmokeTest-Devl/Bundle.jmx"
          )

          counter=1
          failure_report=""
          attachments=()

          for i in "${!environments[@]}"; do
            env="${environments[$i]}"
            path="${environment_paths[$i]}"

            result_dir="./test-automation/Jmeter${env}Result"
            report_dir="./test-automation/Jmeter${env}Report"
            zip_file="./test-automation/Jmeter${env}Report.zip"
            logs_zip_file="./test-automation/Jmeter${env}Logs.zip"

            jtl_file="$result_dir/bundletest.jtl"
            execution_log="$result_dir/$env.log"
            jmeter_log="$result_dir/jmeter-${env}.log"
            report_log="$result_dir/jmeter-${env}-report.log"

            echo "========================================="
            echo "Running FHIR Bundle SmokeTest: $env"
            echo "JMX file: $path"
            echo "========================================="

            mkdir -p "$result_dir" "$report_dir"

            # Remove previous outputs to prevent stale results
            rm -f "$jtl_file" "$execution_log" "$jmeter_log" "$report_log"
            rm -rf "$report_dir"/*
            mkdir -p "$report_dir"

            # Execute JMeter and capture console and internal logs
            ./test-automation/apache-jmeter-5.6.3/bin/jmeter \
              -n \
              -t "$path" \
              -l "$jtl_file" \
              -j "$jmeter_log" \
              > "$execution_log" 2>&1

            jmeter_exit_code=$?
            echo "JMeter exit code: $jmeter_exit_code"

            errors=0
            report_exit_code=1

            # Generate the HTML report if the JTL file exists
            if [[ -f "$jtl_file" ]]; then
              echo "JTL file generated successfully:"
              ls -lh "$jtl_file"

              ./test-automation/apache-jmeter-5.6.3/bin/jmeter \
                -g "$jtl_file" \
                -o "$report_dir/" \
                -j "$report_log"

              report_exit_code=$?
              echo "Report generation exit code: $report_exit_code"

              errors=$(grep "summary =" "$execution_log" \
                | tail -1 \
                | grep -oP 'Err:\s+\K\d+' || true)
              errors="${errors:-0}"
            else
              echo "ERROR: JTL file was not generated: $jtl_file"
            fi

            echo "${env}_errors=$errors" >> "$GITHUB_ENV"

            echo "========== JMeter Console Output =========="
            cat "$execution_log" || true
            echo "============================================"

            # Detect JMeter, report-generation, and missing-JTL failures
            if [[ "$jmeter_exit_code" -ne 0 ||
                  "$report_exit_code" -ne 0 ||
                  "$errors" -gt 0 ||
                  ! -f "$jtl_file" ]]; then

              failure_report="${failure_report}${counter}. ${env}, "
              counter=$((counter + 1))
              attachments+=("$zip_file" "$logs_zip_file")

              echo "FHIR Bundle SmokeTest FAILED"
            else
              echo "FHIR Bundle SmokeTest PASSED"
            fi
          done

          if [[ -z "$failure_report" ]]; then
            failure_report="No failures detected."
          else
            failure_report=$(echo "$failure_report" | sed 's/, $//')
          fi

          failure_attachments=$(IFS=,; echo "${attachments[*]}")

          echo "failure_attachments=$failure_attachments" >> "$GITHUB_OUTPUT"
          echo "failure_report=$failure_report" >> "$GITHUB_OUTPUT"

          echo "========================================="
          echo "Failure Report: $failure_report"
          echo "========================================="

      - name: Archive JMeter Reports and Logs into ZIP files
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

          cd ./test-automation

          for env in "Nexus-dev"; do
            mkdir -p "./Jmeter${env}Report"
            mkdir -p "./Jmeter${env}Result"

            # Archive HTML report
            zip -r "./Jmeter${env}Report.zip" \
              "./Jmeter${env}Report/" || true

            # Archive internal JMeter execution and report logs
            zip -j "./Jmeter${env}Logs.zip" \
              ./Jmeter${env}Result/jmeter-*.log || true
          done

      - name: Upload JMeter Results and Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-dev-fhir-jmeter-results
          path: |
            ./test-automation/JmeterNexus-devResult/
            ./test-automation/JmeterNexus-devReport/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JMeter Logs ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-dev-fhir-jmeter-logs
          path: ./test-automation/JmeterNexus-devLogs.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Send Email Notification (Conditional)
        if: steps.run-tests.outputs.failure_report != 'No failures detected.'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: email-smtp.us-east-1.amazonaws.com
          server_port: 587
          username: ${{ secrets.SES_SMTP_USERNAME }}
          password: ${{ secrets.SES_SMTP_PASSWORD }}

          subject: "Nexus Dev FHIR Bundle SmokeTest Failures"

          body: |
            Hello Team,

            The Nexus Dev FHIR Bundle SmokeTest encountered failures in the following environment:

            ${{ steps.run-tests.outputs.failure_report }}

            Please find the attached report and JMeter log files.

            Detailed JMeter results, including the JTL file,
            HTML report, and internal JMeter logs, are also
            available as artifacts in the GitHub Actions run.

            Regards,
            Tech by Design Automation Team

          content_type: "text/plain"
          from: "Tech by Design FHIR SmokeTest Result <no-reply@tx.techbd.org>"
          to: patrick.johnson@techbd.org, ratheeshkumar-kr@netspective.in, raphael-paily@netspective.in, roshni-kesavan@netspective.in
          attachments: ${{ steps.run-tests.outputs.failure_attachments }}
